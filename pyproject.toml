[project]
name = "bili-spectrum-player"
version = "1.0.0"
description = "Bili音乐播放助手 - 频谱可视化音乐播放器"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "ffmpeg-python>=0.2.0",
    "sounddevice>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backends", "utils"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]
